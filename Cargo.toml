[package]
name = "rs-sqlite2rbat"
version = "0.1.0"
edition = "2024"

description = "Converts SQLite rows to a record batch"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-sqlite2rbat"
homepage = "https://github.com/takanoriyanagitani/rs-sqlite2rbat"
documentation = "https://docs.rs/rs-sqlite2rbat/latest"
keywords = ["sqlite", "arrow", "recordbatch"]

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[dependencies.arrow-array]
version = "60.1.0"
default-features = false
features = [
]

[dependencies.arrow-schema]
version = "60.1.0"
default-features = false
features = [
]

[dependencies.rusqlite]
version = "0.41.0"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]
